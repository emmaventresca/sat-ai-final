# Build the app and prove the data still stages.
#
# The ACT and SAT question data is NOT committed - apps/web/public/data is
# gitignored, because it is generated. It gets rebuilt here instead: the
# package's own `prebuild` runs tools/stage_public_data.py, so whatever is in
# data/ at the time of the push is what goes online. That is what makes an
# edit on the ACT side show up on the site without anyone remembering to
# stage it by hand.
#
# The site itself is deployed by Cloudflare Pages, which builds from this
# repo on its own. This job exists so a push that breaks the build or the
# data staging is caught here rather than discovered on the live site.
#
# stage_public_data.py is an allowlist, deliberately: a new file under data/
# is private until someone adds it. Publishing stays opt-in even here.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci --prefix apps/web

      # The house rule: this has to pass before anything is called done.
      - name: Typecheck
        run: npm run typecheck --prefix apps/web

      # Stages data (via prebuild) and builds.
      - name: Build
        run: npm run build --prefix apps/web

      - name: Report what was built
        run: |
          echo "### Built" >> $GITHUB_STEP_SUMMARY
          du -sh apps/web/dist >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SAT questions: $(python3 -c "import json;print(len(json.load(open('data/practice.json'))))" 2>/dev/null || echo '?')" >> $GITHUB_STEP_SUMMARY
          echo "ACT questions: $(python3 -c "import json;d=json.load(open('data/act/questions.json'));print(len(d.get('items',d)))" 2>/dev/null || echo '?')" >> $GITHUB_STEP_SUMMARY

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
